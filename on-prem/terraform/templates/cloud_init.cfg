#cloud-config
# cloud-init: configuração mínima injetada em cada VM no primeiro boot.
# O objetivo é só deixar a VM ACESSÍVEL por SSH para o Ansible. Toda a
# instalação de Postgres/Patroni/etcd/HAProxy é feita depois, pelo Ansible.
hostname: ${hostname}
fqdn: ${hostname}.local

users:
  - name: ansible
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Garante Python presente (requisito do Ansible) e atualiza pacotes.
package_update: true
packages:
  - python3
  - qemu-guest-agent

runcmd:
  - systemctl enable --now qemu-guest-agent
