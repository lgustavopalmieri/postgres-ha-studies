---
# ============================================================================
# Playbook principal. Ordem IMPORTA:
#   1) etcd primeiro (Patroni depende dele para o consenso/eleição).
#   2) postgres/patroni depois (precisa do etcd no ar para bootstrap).
#   3) haproxy por último (precisa saber dos nós Postgres para rotear).
# ============================================================================

- name: Configurar cluster etcd
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Configurar PostgreSQL + Patroni
  hosts: postgres
  become: true
  roles:
    - patroni

- name: Configurar HAProxy + keepalived (VIP)
  hosts: haproxy
  become: true
  roles:
    - haproxy
