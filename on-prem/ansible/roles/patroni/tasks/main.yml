---
# Instala PostgreSQL + Patroni em cada nó do grupo [postgres].
# O Patroni faz o bootstrap do cluster: o primeiro nó a pegar a "chave" no etcd
# vira primário; os demais clonam dele e viram réplicas. Failover automático.

# --- Disco de dados dedicado ------------------------------------------------
# O Terraform anexou um disco extra (/dev/vdb) para os dados do banco.
# Separar dados do SO facilita backup, expansão e isola o I/O do banco.
- name: Criar filesystem no disco de dados
  community.general.filesystem:
    fstype: ext4
    dev: /dev/vdb
  when: ansible_devices.vdb is defined

- name: Montar o disco de dados em /var/lib/postgresql
  ansible.posix.mount:
    path: /var/lib/postgresql
    src: /dev/vdb
    fstype: ext4
    state: mounted
  when: ansible_devices.vdb is defined

# --- Pacotes ----------------------------------------------------------------
- name: Instalar PostgreSQL, Python e dependências
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - postgresql-client-common
      - python3-pip
      - python3-psycopg2
    state: present
    update_cache: true

- name: Instalar Patroni (com suporte a etcd) via pip
  ansible.builtin.pip:
    name:
      - "patroni[etcd3]"
    state: present

# O Patroni gerencia o Postgres do zero; o serviço do SO não deve competir.
- name: Desabilitar o serviço padrão do PostgreSQL (o Patroni assume o controle)
  ansible.builtin.systemd:
    name: postgresql
    enabled: false
    state: stopped
  ignore_errors: true

# --- Diretórios -------------------------------------------------------------
- name: Criar diretórios de dados e config do Patroni
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory
  loop:
    - /var/lib/postgresql/data
    - /etc/patroni

# --- Configuração -----------------------------------------------------------
- name: Renderizar o patroni.yml deste nó
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart patroni

- name: Renderizar a unit systemd do Patroni
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: restart patroni

- name: Habilitar e iniciar o Patroni
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: started
    daemon_reload: true
