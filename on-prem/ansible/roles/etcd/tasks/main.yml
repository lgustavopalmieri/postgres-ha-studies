---
# Instala e configura um cluster etcd a partir dos nós do grupo [etcd].
# O etcd é o armazém de consenso (Raft) que o Patroni usa para eleger o líder
# e evitar split-brain. Em produção é ímpar (3/5) para sempre haver quórum.

- name: Criar usuário de sistema do etcd
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/etcd

- name: Criar diretório de dados do etcd
  ansible.builtin.file:
    path: /var/lib/etcd
    owner: etcd
    group: etcd
    mode: "0700"
    state: directory

- name: Baixar e extrair o binário do etcd
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64"

- name: Instalar binários etcd e etcdctl em /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    mode: "0755"
  loop:
    - etcd
    - etcdctl

- name: Renderizar a unit systemd do etcd
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: restart etcd

- name: Habilitar e iniciar o etcd
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true
