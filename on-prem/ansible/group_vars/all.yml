---
# Variáveis compartilhadas por todos os papéis.
# Em produção, mova segredos (senhas) para o Ansible Vault:
#   ansible-vault encrypt group_vars/all.yml

cluster_name: pg-ha

# Versões fixadas (evita surpresa entre execuções).
postgres_version: "16"
etcd_version: "3.5.13"
patroni_scope: "pg-cluster"

# Portas
postgres_port: 5432
patroni_api_port: 8008
etcd_client_port: 2379
etcd_peer_port: 2380
haproxy_write_port: 5000
haproxy_read_port: 5001
haproxy_stats_port: 7000

# Credenciais do banco (MOVER PARA VAULT em produção).
postgres_superuser: postgres
postgres_superuser_password: "CHANGE_ME_super"
postgres_replication_user: replicator
postgres_replication_password: "CHANGE_ME_repl"

# VIP (Virtual IP) que "flutua" entre os HAProxy via keepalived.
# É o endereço ÚNICO e ESTÁVEL que a aplicação usa. Se um HAProxy cai, o VIP
# migra para o outro sem a app perceber. Ajuste para um IP livre da sua rede.
haproxy_vip: "192.168.122.250"

# Replicação síncrona? (ver FAILOVER.md do lab para o trade-off)
synchronous_mode: false
