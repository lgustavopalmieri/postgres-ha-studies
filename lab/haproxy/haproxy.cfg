#=============================================================================
# HAProxy: ponto único de entrada para a aplicação.
#
# A ideia central: sua aplicação NÃO conecta direto em pg1/pg2/pg3/pg4.
# Ela conecta no HAProxy, em DUAS portas diferentes:
#
#   - Porta 5000 (ESCRITA): sempre encaminha para o nó PRIMÁRIO atual.
#                           Se houver failover, o HAProxy redireciona sozinho.
#   - Porta 5001 (LEITURA): faz balanceamento entre as RÉPLICAS saudáveis.
#
# Como o HAProxy sabe quem é primário e quem é réplica?
# Ele consulta a REST API do Patroni (porta 8008) de cada nó via health check:
#   /primary -> retorna 200 apenas no primário
#   /replica -> retorna 200 apenas nas réplicas saudáveis
# Assim o roteamento acompanha automaticamente as mudanças do cluster.
#=============================================================================

global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp                 # camada 4: o HAProxy só repassa bytes TCP do protocolo Postgres
    retries 2
    timeout client  30m
    timeout connect 5s
    timeout server  30m
    timeout check   5s

#-----------------------------------------------------------------------------
# Painel de estatísticas (opcional, só para você visualizar o estado).
# Acesse http://localhost:7000  (usuário: admin / senha: admin)
#-----------------------------------------------------------------------------
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:admin

#-----------------------------------------------------------------------------
# ESCRITA -> sempre o primário.
# Sua aplicação aponta as operações de INSERT/UPDATE/DELETE/DDL para a 5000.
#-----------------------------------------------------------------------------
listen postgres_write
    bind *:5000
    option httpchk OPTIONS /primary      # pergunta ao Patroni: "você é o primário?"
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    # Cada server roda o health check em :8008 (porta do Patroni), mas o
    # tráfego real de dados vai para :5432 (porta do Postgres).
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008
    server pg4 pg4:5432 maxconn 100 check port 8008

#-----------------------------------------------------------------------------
# LEITURA -> balanceia entre as réplicas saudáveis (round-robin).
# Sua aplicação aponta os SELECT para a 5001.
#
# Observação: por padrão o /replica do Patroni responde 200 apenas em quem é
# réplica. Logo, o primário NÃO recebe tráfego de leitura aqui — exatamente o
# que queremos para separar carga de leitura e escrita.
#-----------------------------------------------------------------------------
listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk OPTIONS /replica      # pergunta ao Patroni: "você é réplica saudável?"
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008
    server pg4 pg4:5432 maxconn 100 check port 8008
